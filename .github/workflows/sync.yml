name: sync-and-deploy
on:
  schedule: [{ cron: '0 20 * * *' }]   # 每天 UTC 20:00（台灣早上 04:00）
  workflow_dispatch:
  push: { branches: [main] }
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm test
      # YouTube 原始資料快取放在 data-cache 分支（只留一個 commit）。push 時用它重建，
      # 改規則或人工對應（manual-*.json）推上來就生效，不用等隔天同步，也不花配額
      - run: mkdir -p sync/cache && git fetch -q --depth 1 origin data-cache && git show FETCH_HEAD:raw.json > sync/cache/raw.json || echo "沒有快取"
      # 只有排程與手動才同步
      - if: github.event_name != 'push'
        run: npm run sync
        env: { YOUTUBE_API_KEY: '${{ secrets.YOUTUBE_API_KEY }}' }
      - if: github.event_name == 'push'
        run: if [ -s sync/cache/raw.json ]; then npm run rebuild; else echo "沒有快取，沿用已提交的資料"; fi
      # 資料有變才提交；每天的同步提交也讓排程不會因 repo 60 天無活動被停用
      - run: |
          git config user.name "aniqube-bot"; git config user.email "bot@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || { git commit -m "chore: catalog ${{ github.event_name == 'push' && 'rebuild' || 'daily sync' }} $(date -u +%F)" && git push || echo "推送失敗（main 已前進），下次 push 會再重建"; }
      - if: github.event_name != 'push'
        run: |
          cd sync/cache && git init -q -b data-cache && git add raw.json
          git -c user.name=aniqube-bot -c user.email=bot@users.noreply.github.com commit -qm "raw cache $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data-cache
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
